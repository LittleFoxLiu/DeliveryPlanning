<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17223b" />
    <title>RoutePilot — Delivery control room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app-shell" class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div><strong>route<span>pilot</span></strong><small>delivery OS</small></div>
        </div>
        <div class="workspace-switcher"><div class="avatar">NC</div><div><b>North Coast</b><span>Operations team</span></div><i class="chevron">⌄</i></div>
        <nav class="main-nav" aria-label="Main navigation">
          <p class="nav-label">Workspace</p>
          <a href="#overview" data-route="overview"><span class="nav-icon">◈</span>Overview</a>
          <a href="#routes" data-route="routes"><span class="nav-icon">⌁</span>Route board <em id="route-nav-count">4</em></a>
          <p class="nav-label">Inputs</p>
          <a href="#traffic" data-route="traffic"><span class="nav-icon">≋</span>Traffic conditions</a>
          <a href="#orders" data-route="orders"><span class="nav-icon">□</span>Customer needs <em id="order-nav-count">12</em></a>
          <a href="#drivers" data-route="drivers"><span class="nav-icon">♧</span>Driver conditions</a>
        </nav>
        <div class="sidebar-bottom">
          <div class="sync-status"><span class="status-dot"></span><div><b>System synced</b><span id="last-sync">just now</span></div></div>
          <a href="#settings" data-route="settings" class="settings-link"><span class="nav-icon">⚙</span>Settings</a>
          <div class="user-row"><div class="user-avatar">AM</div><div><b>Alex Morgan</b><span>Dispatcher</span></div><span class="more">•••</span></div>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar"><div class="breadcrumb"><span>Operations</span><b>/</b><strong id="page-kicker">Overview</strong></div><div class="topbar-actions"><span class="live-pill"><span></span>Live data</span><button class="icon-button" title="Notifications">♢<i></i></button><div class="top-date">Tuesday, 18 June 2024</div></div></header>
        <div id="toast" class="toast" role="status"></div>
        <div id="view-root"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
